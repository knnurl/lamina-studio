<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lamina Studio</title>
<meta name="description" content="Design layered, laser-cut art: lattice mandalas, circuit panels and shadow boxes, exported as cut-ready SVG and DXF.">
<meta name="theme-color" content="#0c0911">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/*CSS*/
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 class="mark">Lamina</h1>
    <nav class="steps" id="steps" aria-label="Steps"></nav>
    <div class="spacer"></div>
    <div class="tools" id="tools-right"></div>
    <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch to light theme">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
    </button>
  </header>
  <aside class="side" id="panel" aria-labelledby="panel-title">
    <div class="panel-head">
      <span class="panel-kicker" id="panel-kicker"></span>
      <h2 class="panel-title" id="panel-title"></h2>
      <p class="panel-guide" id="panel-guide"></p>
    </div>
    <div class="panel-body" id="panel-body"></div>
    <div class="panel-foot">
      <button class="btn ghost" id="panel-back" type="button">‹ Back</button>
      <button class="btn" id="panel-next" type="button">Next</button>
    </div>
  </aside>
  <main class="view">
    <nav class="tabs" id="tabs" role="tablist" aria-label="Views"></nav>
    <div class="stage" id="stage"></div>
    <div class="layer-strip" id="layer-strip" role="listbox" aria-label="Layers, front first"></div>
  </main>
  <footer class="status" role="status">
    <span class="light" id="status-light" data-level="busy"></span>
    <span id="status-text">Starting</span>
  </footer>
</div>
<div class="start" id="start" hidden></div>
<div class="tour" id="tour" hidden></div>
<script type="text/plain" id="lamina-worker-src">/*WORKER*/</script>
<script>/*APP*/</script>
</body>
</html>
